kind = "slides"
previewPath = "/bds-game-mechanics/"
title = "BDS Case Files — Game Mechanics"
description = "A 12-slide player guide covering fictional workplace-safe play, room setup, specialist roles, cooperative voting and investigations, evidence, accusations, scoring, ranks, host controls, and replay."
version = "1.0.0"
id = "artifacts/bds-game-mechanics"
router = "path"

[[services]]
name = "web"
paths = [ "/bds-game-mechanics/" ]
localPort = 21091

[services.development]
run = "pnpm --filter @workspace/bds-game-mechanics run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bds-game-mechanics", "run", "build" ]
serve = "static"
publicDir = "artifacts/bds-game-mechanics/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21091"
BASE_PATH = "/bds-game-mechanics/"
