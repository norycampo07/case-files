openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BDS Case Files room and cooperative mystery game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: case-files
    description: Multiplayer case rooms and investigation actions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rooms:
    post:
      operationId: createRoom
      tags: [case-files]
      summary: Create a case room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateInput"
      responses:
        "201":
          description: The new lobby
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomView"
        "400":
          description: Invalid player name
  /rooms/{code}:
    get:
      operationId: getRoom
      tags: [case-files]
      summary: Get the current room state for a player
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomView"
        "404":
          description: Room or player not found
  /rooms/{code}/players:
    post:
      operationId: joinRoom
      tags: [case-files]
      summary: Join an existing lobby
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomJoinInput"
      responses:
        "200":
          description: The updated lobby
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomView"
        "404":
          description: Room not found
        "409":
          description: Room is full or already in progress
  /rooms/{code}/start:
    post:
      operationId: startGame
      tags: [case-files]
      summary: Start a case as the room host
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerActionInput"
      responses:
        "200":
          description: The started case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomView"
        "403":
          description: Only the host can start the game
        "409":
          description: The lobby needs at least two players
  /rooms/{code}/votes:
    post:
      operationId: castInvestigationVote
      tags: [case-files]
      summary: Vote for the team's next investigation action
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationVoteInput"
      responses:
        "200":
          description: The updated investigation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomView"
        "409":
          description: Investigation is not accepting votes
  /rooms/{code}/messages:
    post:
      operationId: sendRoomMessage
      tags: [case-files]
      summary: Send a message to the case room
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: The updated room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomView"
  /rooms/{code}/interview:
    post:
      operationId: useExtraInterview
      tags: [case-files]
      summary: Use the interviewer's free follow-up question
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerActionInput"
      responses:
        "200":
          description: Updated private interview evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomView"
  /rooms/{code}/accusation:
    post:
      operationId: submitAccusation
      tags: [case-files]
      summary: Submit the team's final accusation
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccusationInput"
      responses:
        "200":
          description: The resolved case and team score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomView"
        "409":
          description: Case is not accepting an accusation
  /rooms/{code}/settings:
    patch:
      operationId: updateRoomSettings
      tags: [case-files]
      summary: Host controls for rumors and chat
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomSettingsInput" }
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomView" }
        "403": { description: Host only }
  /rooms/{code}/reset:
    post:
      operationId: resetGame
      tags: [case-files]
      summary: Discard the active case and return the team to the lobby
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerActionInput" }
      responses:
        "200":
          description: Empty lobby, same room and team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomView" }
        "403": { description: Host only }
  /rooms/{code}/new-case:
    post:
      operationId: startNewCase
      tags: [case-files]
      summary: Discard the previous case and generate another for the same team
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerActionInput" }
      responses:
        "200":
          description: New investigation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomView" }
        "403": { description: Host only }
  /tournaments:
    post:
      operationId: createTournament
      tags: [case-files]
      summary: Create a tournament lobby as host
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentCreateInput" }
      responses:
        "201":
          description: Tournament lobby
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
  /tournaments/{code}/lobby:
    get:
      operationId: getTournamentLobby
      tags: [case-files]
      summary: Get joinable team slots for a room code
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public lobby information; does not expose case solutions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentLobby" }
  /tournaments/{code}:
    get:
      operationId: getTournament
      tags: [case-files]
      summary: Get tournament state for an authenticated room member
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: playerId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Member-scoped tournament state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
  /tournaments/{code}/players:
    post:
      operationId: joinTournament
      tags: [case-files]
      summary: Join an available team before the tournament starts
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentJoinInput" }
      responses:
        "200":
          description: Joined tournament
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
  /tournaments/{code}/settings:
    patch:
      operationId: setTournamentSettings
      tags: [case-files]
      summary: Host configures cases, teams and voting timer before start
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentSettingsInput" }
      responses:
        "200":
          description: Updated tournament
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
  /tournaments/{code}/teams:
    post:
      operationId: manageTournamentTeam
      tags: [case-files]
      summary: Host adds, removes or renames a team in the lobby
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentTeamInput" }
      responses:
        "200":
          description: Updated teams
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
  /tournaments/{code}/start:
    post:
      operationId: startTournament
      tags: [case-files]
      summary: Host starts the first shared case when all teams have 1-10 players per team
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentPlayerInput" }
      responses:
        "200":
          description: First round
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
  /tournaments/{code}/advance:
    post:
      operationId: advanceTournamentScreen
      tags: [case-files]
      summary: Host advances shared stages and results; members may close a private extra clue
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentPlayerInput" }
      responses:
        "200":
          description: Next team screen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
  /tournaments/{code}/clues:
    post:
      operationId: requestTournamentClue
      tags: [case-files]
      summary: Reveal one more team clue and reduce case value by 10
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentPlayerInput" }
      responses:
        "200":
          description: New team clue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
  /tournaments/{code}/voting:
    post:
      operationId: beginTournamentVote
      tags: [case-files]
      summary: Members mark their team ready; host opens synchronized ballots for all teams
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentPlayerInput" }
      responses:
        "200":
          description: Active team ballot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
  /tournaments/{code}/ballots:
    post:
      operationId: castTournamentBallot
      tags: [case-files]
      summary: Cast one individual suspect vote for this team's ballot
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentBallotInput" }
      responses:
        "200":
          description: Updated real-time vote totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
  /tournaments/{code}/next:
    post:
      operationId: nextTournamentRound
      tags: [case-files]
      summary: Host advances the tournament to the next shared case
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentPlayerInput" }
      responses:
        "200":
          description: Next round
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
  /tournaments/{code}/reset:
    post:
      operationId: resetTournament
      tags: [case-files]
      summary: Host clears results and returns the same teams to a fresh lobby
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentPlayerInput" }
      responses:
        "200":
          description: Fresh tournament lobby
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentView" }
components:
  schemas:
    TournamentTeamInput:
      type: object
      required: [playerId, action]
      properties:
        playerId: { type: string }
        action: { type: string, enum: [add, remove, rename] }
        teamId: { type: integer, minimum: 0, maximum: 4 }
        name: { type: string, minLength: 1, maxLength: 30 }
    TournamentCreateInput:
      type: object
      required: [displayName, consentAcknowledged]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 24 }
        consentAcknowledged: { type: boolean, enum: [true] }
    TournamentJoinInput:
      type: object
      required: [displayName, teamId, consentAcknowledged]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 24 }
        teamId: { type: integer, minimum: 0, maximum: 4 }
        consentAcknowledged: { type: boolean, enum: [true] }
    TournamentPlayerInput:
      type: object
      required: [playerId]
      properties:
        playerId: { type: string }
    TournamentSettingsInput:
      type: object
      required: [playerId, teamCount, casesPerTournament, votingSeconds]
      properties:
        playerId: { type: string }
        teamCount: { type: integer, minimum: 1, maximum: 5 }
        casesPerTournament: { type: integer, enum: [1, 3, 5, 7, 10] }
        votingSeconds: { type: integer, minimum: 15, maximum: 180 }
    TournamentBallotInput:
      type: object
      required: [playerId, suspect]
      properties:
        playerId: { type: string }
        suspect: { type: string }
    TournamentPlayer:
      type: object
      required: [id, displayName, teamId, isHost, connected]
      properties:
        id: { type: string }
        displayName: { type: string }
        teamId: { type: integer }
        isHost: { type: boolean }
        connected: { type: boolean }
    TournamentSettings:
      type: object
      required: [teamCount, casesPerTournament, votingSeconds]
      properties:
        teamCount: { type: integer }
        casesPerTournament: { type: integer }
        votingSeconds: { type: integer }
    TournamentTeam:
      type: object
      required: [id, name, playerCount, score, correctCount, extraCluesUsed, princeBlames, coffeeSolves]
      properties:
        ready: { type: boolean }
        ballotComplete: { type: boolean }
        id: { type: integer }
        name: { type: string }
        playerCount: { type: integer }
        score: { type: integer }
        correctCount: { type: integer }
        extraCluesUsed: { type: integer }
        princeBlames: { type: integer }
        coffeeSolves: { type: integer }
    TournamentLobby:
      type: object
      required: [code, status, teamCount, teams]
      properties:
        code: { type: string }
        status: { type: string }
        teamCount: { type: integer }
        teams:
          type: array
          items: { $ref: "#/components/schemas/TournamentTeam" }
    TournamentCharacter:
      type: object
      required: [name, title, personality, portrait]
      properties:
        name: { type: string }
        title: { type: string }
        personality: { type: string }
        portrait: { type: string }
    TournamentCase:
      type: object
      required: [id, title, brief, characters, clueCount, difficulty]
      properties:
        id: { type: string }
        title: { type: string }
        brief: { type: string }
        characters:
          type: array
          items: { $ref: "#/components/schemas/TournamentCharacter" }
        clueCount: { type: integer }
        difficulty: { type: string, enum: [Easy, Medium, Hard] }
        family: { type: string }
        basePoints: { type: integer }
    TournamentTally:
      type: object
      required: [suspect, count, percent]
      properties:
        suspect: { type: string }
        count: { type: integer }
        percent: { type: integer }
    TournamentTeamState:
      type: object
      required: [teamId, screen, clues, value, hasVoted, deadline, runoffOptions, tallies, submittedVotes, choice]
      properties:
        teamId: { type: integer }
        screen: { type: string, enum: [brief, roster, clue1, clue2, clue3, choice, extra, vote, runoff, waiting] }
        clues:
          type: array
          items: { type: string }
        value: { type: integer }
        ready: { type: boolean }
        hasVoted: { type: boolean }
        deadline: { type: ["integer", "null"] }
        runoffOptions:
          type: array
          items: { type: string }
        tallies:
          type: array
          items: { $ref: "#/components/schemas/TournamentTally" }
        submittedVotes: { type: integer }
        choice: { type: ["string", "null"] }
    TournamentResult:
      type: object
      required: [teamId, teamName, suspect, correct, points, extraClues]
      properties:
        teamId: { type: integer }
        teamName: { type: string }
        suspect: { type: ["string", "null"] }
        correct: { type: boolean }
        points: { type: integer }
        extraClues: { type: integer }
    TournamentReveal:
      type: object
      required: [culprit, what, why, results]
      properties:
        culprit: { type: string }
        what: { type: string }
        why: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/TournamentResult" }
    TournamentAward:
      type: object
      required: [name, teamNames, value]
      properties:
        name: { type: string }
        teamNames:
          type: array
          items: { type: string }
        value: { type: integer }
    TournamentView:
      type: object
      required: [code, status, hostId, me, settings, roundIndex, difficulty, teams, players, case, teamState, reveal, winners, awards]
      properties:
        code: { type: string }
        status: { type: string, enum: [lobby, round, reveal, finished] }
        revealStage: { type: string, enum: [culprit, results, champions] }
        hostId: { type: string }
        me: { $ref: "#/components/schemas/TournamentPlayer" }
        settings: { $ref: "#/components/schemas/TournamentSettings" }
        roundIndex: { type: integer }
        difficulty: { type: ["string", "null"] }
        teams:
          type: array
          items: { $ref: "#/components/schemas/TournamentTeam" }
        players:
          type: array
          items: { $ref: "#/components/schemas/TournamentPlayer" }
        case:
          oneOf:
            - { $ref: "#/components/schemas/TournamentCase" }
            - { type: "null" }
        teamState:
          oneOf:
            - { $ref: "#/components/schemas/TournamentTeamState" }
            - { type: "null" }
        reveal:
          oneOf:
            - { $ref: "#/components/schemas/TournamentReveal" }
            - { type: "null" }
        winners:
          type: array
          items: { type: string }
        awards:
          type: array
          items: { $ref: "#/components/schemas/TournamentAward" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RoomCreateInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 24
        consentAcknowledged:
          type: boolean
          enum: [true]
      required: [displayName, consentAcknowledged]
    RoomJoinInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 24
        consentAcknowledged:
          type: boolean
          enum: [true]
      required: [displayName, consentAcknowledged]
    RoomSettings:
      type: object
      properties:
        rumorsEnabled: { type: boolean }
        chatEnabled: { type: boolean }
      required: [rumorsEnabled, chatEnabled]
    RoomSettingsInput:
      type: object
      properties:
        playerId: { type: string }
        rumorsEnabled: { type: boolean }
        chatEnabled: { type: boolean }
      required: [playerId, rumorsEnabled, chatEnabled]
    PlayerActionInput:
      type: object
      properties:
        playerId:
          type: string
      required: [playerId]
    InvestigationVoteInput:
      type: object
      properties:
        playerId:
          type: string
        action:
          $ref: "#/components/schemas/InvestigationAction"
      required: [playerId, action]
    ChatMessageInput:
      type: object
      properties:
        playerId:
          type: string
        text:
          type: string
          minLength: 1
          maxLength: 500
      required: [playerId, text]
    AccusationInput:
      type: object
      properties:
        playerId:
          type: string
        suspect:
          type: string
        motive:
          type: string
        method:
          type: string
      required: [playerId, suspect, motive, method]
    InvestigationAction:
      type: string
      enum:
        - interview-suspect
        - review-emails
        - examine-crime-scene
        - review-security-logs
        - check-timeline
        - verify-alibi
        - search-office
        - analyze-evidence
        - review-project-tracker
        - audit-recent-changes
    PlayerRole:
      type: string
      enum: [Forensics Expert, Interviewer, Archivist, Analyst, Profiler]
    RoomStatus:
      type: string
      enum: [lobby, investigation, resolved]
    Suspect:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        profile:
          type: string
        alibi:
          type: string
        suspiciousTrait:
          type: string
      required: [name, title, profile, alibi, suspiciousTrait]
    PlayerSummary:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/PlayerRole"
        isHost:
          type: boolean
        connected:
          type: boolean
      required: [id, displayName, role, isHost, connected]
    CurrentPlayer:
      type: object
      properties:
        id:
          type: string
        role:
          $ref: "#/components/schemas/PlayerRole"
        roleDescription:
          type: string
        privateBrief:
          type: string
        extraClue:
          oneOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
        extraInterviewAvailable:
          type: boolean
      required: [id, role, roleDescription, privateBrief, extraClue, extraInterviewAvailable]
    CaseDetails:
      type: object
      properties:
        title:
          type: string
        location:
          type: string
        crime:
          type: string
        openingBrief:
          type: string
        suspects:
          type: array
          items:
            $ref: "#/components/schemas/Suspect"
        initialEvidence:
          type: array
          items: { type: string }
        rumors:
          type: array
          items: { type: string }
      required: [title, location, crime, openingBrief, suspects, initialEvidence, rumors]
    Evidence:
      type: object
      properties:
        id:
          type: string
        action:
          $ref: "#/components/schemas/InvestigationAction"
        heading:
          type: string
        text:
          type: string
        foundAt:
          type: string
        privateTo:
          type: ["string", "null"]
      required: [id, action, heading, text, foundAt, privateTo]
    TimelineEntry:
      type: object
      properties:
        time:
          type: string
        event:
          type: string
      required: [time, event]
    RoomMessage:
      type: object
      properties:
        id:
          type: string
        playerId:
          type: string
        displayName:
          type: string
        text:
          type: string
        createdAt:
          type: string
      required: [id, playerId, displayName, text, createdAt]
    VoteTally:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/InvestigationAction"
        count:
          type: integer
        playerIds:
          type: array
          items:
            type: string
      required: [action, count, playerIds]
    CaseResolution:
      type: object
      properties:
        suspect:
          type: string
        motive:
          type: string
        method:
          type: string
        summary:
          type: string
        score:
          type: integer
        remainingActionBonus:
          type: integer
        rank:
          type: string
          enum: [Rookie Detectives, Junior Investigators, Senior Investigators, Elite Detectives, Master Detectives]
        clueExplanations:
          type: array
          items: { type: string }
      required: [suspect, motive, method, summary, score, remainingActionBonus, rank, clueExplanations]
    RoomView:
      type: object
      properties:
        code:
          type: string
        caseId:
          type: string
        settings:
          $ref: "#/components/schemas/RoomSettings"
        motives:
          type: array
          items: { type: string }
        methods:
          type: array
          items: { type: string }
        status:
          $ref: "#/components/schemas/RoomStatus"
        hostId:
          type: string
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        me:
          $ref: "#/components/schemas/CurrentPlayer"
        case:
          oneOf:
            - $ref: "#/components/schemas/CaseDetails"
            - type: "null"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEntry"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/RoomMessage"
        votes:
          type: array
          items:
            $ref: "#/components/schemas/VoteTally"
        actionsRemaining:
          type: integer
        investigationLimit:
          type: integer
        teamScore:
          type: integer
        resolution:
          oneOf:
            - $ref: "#/components/schemas/CaseResolution"
            - type: "null"
      required:
        - code
        - caseId
        - settings
        - motives
        - methods
        - status
        - hostId
        - players
        - me
        - case
        - evidence
        - timeline
        - messages
        - votes
        - actionsRemaining
        - investigationLimit
        - teamScore
        - resolution

